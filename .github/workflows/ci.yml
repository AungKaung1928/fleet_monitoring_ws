name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt ruff

      - name: Lint
        run: ruff check pipeline/ scripts/ dashboard/

      - name: Validate fleet generator
        run: |
          python scripts/generate_fleet.py
          git diff --exit-code worlds/fleet.sdf config/fleet.rviz \
            || (echo "worlds/rviz out of sync with fleet.yaml — run 'make world' and commit" && exit 1)

      - name: Start infra (Kafka KRaft, QuestDB, Postgres, Grafana)
        run: docker compose up -d --wait
        env:
          COMPOSE_PARALLEL_LIMIT: "4"

      - name: Run end-to-end smoke test
        run: python scripts/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
