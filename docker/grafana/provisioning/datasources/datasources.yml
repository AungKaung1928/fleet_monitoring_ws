apiVersion: 1

datasources:
  # QuestDB speaks the PostgreSQL wire protocol on 8812 — no plugin needed.
  - name: QuestDB
    uid: questdb
    type: postgres
    access: proxy
    url: questdb:8812
    database: qdb
    user: admin
    secureJsonData:
      password: quest
    jsonData:
      sslmode: disable
      postgresVersion: 1400
      timescaledb: false
    isDefault: true
    editable: false

  - name: FleetPostgres
    uid: fleetpg
    type: postgres
    access: proxy
    url: postgres:5432
    database: fleet
    user: fleet
    secureJsonData:
      password: fleet
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
